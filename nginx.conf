server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    types {
        application/javascript js mjs;
    }

    location /app/.env/ {
        proxy_pass http://portfolio-backend:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|svg|ttf|json)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}