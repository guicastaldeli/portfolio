<!DOCTYPE html>
<html lang="en">
<head>

    <title>Login</title>
    <link rel="stylesheet" href="/styles/auth.css">
</head>

        <h2>Login</h2>

    </form>
    <script type="module" src="/scripts/server/auth.js"></script>
</body>
</html>
