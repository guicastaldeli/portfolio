services:
  portfolio-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portfolio-backend
    restart: unless-stopped
    x-url: https://xyz98102server-portfolio-guicastaldeli.de5.net
    ports:
      - "3001:3001"
    environment:
      - APP_ENV=prod
    volumes:
      - ./app/.env:/app/app/.env
      - ./app/db/data:/app/app/db/data

  portfolio-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: portfolio-frontend
    restart: unless-stopped
    x-url: https://portfolio-guicastaldeli.de5.net
    ports:
      - "3000:80"
    depends_on:
      - portfolio-backend